[workspace]
resolver = "2"
members = ["crates/kernel", "crates/spec", "crates/harnessc", "crates/refinery"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
tempfile = "3"
kernel = { path = "crates/kernel", package = "harness-kernel" }
spec = { path = "crates/spec" }
